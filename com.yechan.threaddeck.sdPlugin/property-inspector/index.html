<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-copy="title">ThreadDeck settings</title>
    <link rel="stylesheet" href="property-inspector.css">
  </head>
  <body>
    <main id="settings" aria-busy="true">
      <section id="settings-loading" class="status-panel">
        <p data-copy="loading">Loading settings…</p>
      </section>

      <section id="task-settings" class="setting-group" hidden>
        <label for="task-source" data-copy="taskLabel">Task slot</label>
        <select id="task-source" data-setting="taskSource">
          <option value="current" data-copy="currentTask">Current task</option>
          <option value="top1">Top task 1</option>
          <option value="top2">Top task 2</option>
          <option value="top3">Top task 3</option>
          <option value="top4">Top task 4</option>
          <option value="top5">Top task 5</option>
          <option value="top6">Top task 6</option>
          <option value="top7">Top task 7</option>
          <option value="top8">Top task 8</option>
        </select>
        <p data-copy="taskHelp">Choose a Codex task for this key.</p>
      </section>

      <section id="command-settings" class="setting-group" hidden>
        <label for="command" data-copy="commandLabel">Command</label>
        <select id="command" data-setting="command">
          <option value="new-task" data-copy="newTask">New task</option>
          <option value="side-chat" data-copy="sideChat">Side Chat</option>
          <option value="send" data-copy="send">Send</option>
          <option value="approve" data-copy="approve">Approve</option>
          <option value="decline" data-copy="decline">Decline</option>
        </select>
        <p id="command-help" data-copy="commandHelp">Send uses Return on a tap and Command+Return after the key turns blue.</p>
      </section>

      <section id="task-actions-settings" class="setting-group" hidden>
        <label for="task-action" data-copy="taskActionLabel">Task action</label>
        <select id="task-action" data-setting="command">
          <option value="approve" data-copy="approve">Approve</option>
          <option value="decline" data-copy="decline">Decline</option>
        </select>
        <p id="task-action-help" data-copy="approvalHelp">Approve a pending request once or decline it. Blue Sent means the action was sent.</p>
      </section>

      <section id="approval-target-settings" class="setting-group" hidden>
        <label for="approval-target" data-copy="approvalTargetLabel">Approval target</label>
        <select id="approval-target" data-setting="approvalTarget" aria-describedby="approval-target-help">
          <option value="" data-copy="chooseApprovalTarget" disabled>Choose an approval target…</option>
          <option value="task-key" data-copy="approvalTaskKey">Task selected on Stream Deck</option>
          <option value="current-dialog" data-copy="approvalCurrentDialog">Current dialog (foreground)</option>
        </select>
        <p id="approval-target-help"></p>
      </section>

      <section id="navigation-settings" class="setting-group" hidden>
        <label for="page-direction" data-copy="directionLabel">Direction</label>
        <select id="page-direction" data-setting="pageDirection">
          <option value="previous" data-copy="previousPage">Previous page</option>
          <option value="next" data-copy="nextPage">Next page</option>
        </select>
      </section>

      <footer>
        <span id="save-status" role="status" aria-live="polite"></span>
        <a href="https://github.com/y5862000/threaddeck-for-codex/blob/main/docs/TROUBLESHOOTING.md"
           target="_blank"
           rel="noreferrer"
           data-copy="help">Help</a>
      </footer>
    </main>
    <script src="property-inspector.js"></script>
  </body>
</html>
